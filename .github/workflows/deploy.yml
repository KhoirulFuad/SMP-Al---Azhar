name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Install NPM dependencies & build assets
        run: |
          npm install
          npm run build

      - name: Remove node_modules before packaging
        run: rm -rf node_modules

      - name: Create deployment archive
        run: tar -czf deploy.tar.gz --exclude=".git" .

      - name: Upload archive via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          username: ${{ secrets.SSH_USERNAME }}
          server: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
          local_path: './deploy.tar.gz'
          remote_path: '/home/smpisl10/public_html'
          sftp_only: true
          delete_remote_files: false

      - name: Extract archive & run artisan commands on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/public_html
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            php artisan migrate --force
            php artisan storage:link || true
            php artisan optimize:clear
            php artisan optimize